llm:
  base_url: "https://openrouter.ai/api/v1"
  temperature: 0.1
  max_tokens: 1500
  batch_size: 10
  max_workers: 10

rag:
  facts_path: "outputs/rag_facts.jsonl"
  index_dir: "outputs/rag_index"
  top_k: 5
  retrieve_candidates: 20
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  fact_batch_size: 10
  fact_max_workers: 10

eval:
  train_ratio: 0.7
  price_lag_weeks: 1

streak:
  max_weeks: 7
  max_days: 4
  flat_threshold: 0.01  # 1% — |weekly return| <= threshold => flat

prompts:
  streak_predict: "prompts/streak_predict.yaml"
  analyst: "prompts/system.md"

context:
  window_weeks: 4
  window_days: 28

finbert:
  model_name: "ProsusAI/finbert"
  max_length: 512
  max_rag_chars: 2000
  flat_score_threshold: 0.1
